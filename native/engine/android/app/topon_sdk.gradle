repositories {
    flatDir {
        dirs 'libs'
    }
    //Anythink(Core)
    maven {
        url "https://jfrog.takuad.com/artifactory/china_sdk"
    }
    // Debugger UI
    maven {
        url "https://jfrog.anythinktech.com/artifactory/debugger"
    }

}
dependencies {
    //Anythink (Necessary)
    api "com.anythink.sdk:core-taku:6.6.22.1"

    //Support (Necessary)
    api "com.android.support:appcompat-v7:28.0.0"

    //Anythink Kuying(Adx) SDK(Necessary)
    api "com.anythink.sdk:adapter-taku-sdm:6.5.77.1.1"
    api "com.smartdigimkttech.sdk:sdm-sdk-cn:6.5.77"

    // Debugger UI Tools (v6.5.50+)
    implementation 'com.anythink.sdk:debugger-ui:1.1.3'

}
